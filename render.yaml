services:
  - type: web
    name: creatoros-api
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt

    preDeployCommand: python backend/manage.py migrate

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

      - key: GEMINI_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      - key: DB_NAME
        fromDatabase:
          name: creatoros-db
          property: database

      - key: DB_USER
        fromDatabase:
          name: creatoros-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: creatoros-db
          property: password

      - key: DB_HOST
        fromDatabase:
          name: creatoros-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: creatoros-db
          property: port

databases:
  - name: creatoros-db
    plan: free
    region: singapore